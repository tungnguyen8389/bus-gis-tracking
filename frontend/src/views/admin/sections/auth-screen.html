<!-- MÀN HÌNH ĐĂNG NHẬP AUTH -->
<div id="auth-screen">
  <div class="auth-card">
    <div style="text-align: center; margin-bottom: 24px;">
      <i class="fa-solid fa-bus" style="font-size: 38px; color: var(--primary);"></i>
      <h2 style="margin-top: 10px; font-size: 20px; color: #1e293b;">Đăng Nhập Quản Trị</h2>
      <p style="font-size: 13px; color: var(--text-muted); margin-top: 4px;">Hệ Thống Web GIS Giám Sát Xe Buýt 2D</p>
    </div>

    <div id="login-alert" style="display: none; padding: 10px; margin-bottom: 14px; border-radius: 6px; font-size: 13px; background: #fee2e2; color: #b91c1c;"></div>

    <form id="login-form" data-submit="handleLogin">
      <div class="form-group">
        <label>Tên đăng nhập:</label>
        <input type="text" id="login_username" class="form-control" placeholder="admin" required value="admin" />
      </div>
      <div class="form-group">
        <label>Mật khẩu:</label>
        <input type="password" id="login_password" class="form-control" placeholder="••••••••" required value="admin123" />
      </div>
      <button type="submit" class="btn btn-primary" style="width: 100%; padding: 10px; margin-top: 8px; justify-content: center;">
        <i class="fa-solid fa-right-to-bracket"></i> Đăng Nhập
      </button>
    </form>

    <div style="margin-top: 18px; font-size: 12px; color: #64748b; text-align: center; line-height: 1.5;">
      Tài khoản mặc định: <b>admin</b> / <b>admin123</b><br>
      (Hoặc <b>manager</b> / <b>manager123</b>)
    </div>
  </div>
</div>
