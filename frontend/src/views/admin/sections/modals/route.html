<!-- MODAL: TUYẾN XE -->
<div id="modal-route" class="modal-overlay">
  <div class="modal-box">
    <div class="modal-header">
      <span id="modal-route-title">Thêm Tuyến Xe Buýt</span>
      <button class="btn btn-sm btn-outline" data-action="closeModal" data-arg="modal-route">&times;</button>
    </div>
    <div class="modal-body">
      <form id="form-route" data-submit="saveRoute">
        <div class="form-group">
          <label>Mã tuyến (Route ID):</label>
          <input type="text" id="route_id" class="form-control" placeholder="BUS_08" required />
        </div>
        <div class="form-group">
          <label>Số hiệu tuyến:</label>
          <input type="text" id="route_number" class="form-control" placeholder="08" required />
        </div>
        <div class="form-group">
          <label>Tên tuyến:</label>
          <input type="text" id="route_name" class="form-control" placeholder="Bến xe Buýt ĐHQG - Bến Thành" required />
        </div>
        <div class="form-group">
          <label>Cự ly (km):</label>
          <input type="number" step="0.1" id="route_distance" class="form-control" value="15.5" />
        </div>
        <div class="form-group">
          <label>Giãn cách chuyến (phút):</label>
          <input type="number" id="route_headway" class="form-control" value="10" />
        </div>
        <div class="modal-footer" style="padding-right:0; padding-bottom:0;">
          <button type="button" class="btn btn-secondary" data-action="closeModal" data-arg="modal-route">Hủy</button>
          <button type="submit" class="btn btn-primary">Lưu Tuyến Xe</button>
        </div>
      </form>
    </div>
  </div>
</div>
